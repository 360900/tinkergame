on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

name: "TinkerGame checks"
permissions: {}

jobs:
  checks:
    name: Bash and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          version: v0.10.0
      - name: Run smoke checks
        run: ./tests/smoke.sh
        env:
          TINKERGAME_SKIP_SHELLCHECK: "1"
